name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please check the [Troubleshooting](https://github.com/GreanOrg/GreanCast#troubleshooting) section first.
        **Security issues:** don't open a public issue, see [SECURITY.md](https://github.com/GreanOrg/GreanCast/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: greancast-version
    attributes:
      label: GreanCast version
      description: GreanCast › About GreanCast, or the commit you built.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 27.2, MacBook Pro M3
    validations:
      required: true
  - type: input
    id: xcode
    attributes:
      label: Xcode version
      placeholder: Xcode 27.1
    validations:
      required: true
  - type: input
    id: iphone
    attributes:
      label: iPhone model and iOS version
      placeholder: iPhone 17 Pro, iOS 27.3
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Connection
      options:
        - USB
        - Wi‑Fi
    validations:
      required: true
  - type: dropdown
    id: team
    attributes:
      label: Apple developer account
      options:
        - Paid
        - Free
        - Don't know
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Relevant lines from ~/Library/Logs/GreanCast.log (Settings › Advanced › Open Log File). Remove anything private.
      render: text
