name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: "Describe your use case: what you're trying to do and what gets in the way today."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like?
      description: How you imagine it working in GreanCast.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other tools you've tried, if any.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd be willing to open a pull request for this.
